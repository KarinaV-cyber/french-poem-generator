<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Love+Ya+Like+A+Sister&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Varela+Round&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="src/style.css"/>
    <title>AI French Poem Generator</title>
</head>
<body>
    <div class="container">
    <header>
    <h1>AI French Poem Generator</h1>
    </header>
  <main>
    <div class="form-wrapper">
<form id="poem-generator-form">
    <input type="text" placeholder="Enter a poetic interest"  autofocus required autocomplete="off" class="instructions" id="user-instructions" />
   
    <input type="submit" class="submit-button" />
   </form>
<div class="hint">Example: Flowers, Paris, or Kisses 👄 </div>
</div>
<div class="poem hidden" id="poem">
        </div>
  </main>

    <footer>
        The AI project was coded by <a href="https://github.com/KarinaV-cyber/french-poem-generator" target="_blank">Karina Smith</a>open-sourced on <a href="https://github.com/KarinaV-cyber" target="_blank">GitHub</a>
      and is hosted on <a href="https://french-poem-generator.onrender.com" target="_blank">Render</a>
    </footer>
    </div>
    <script src="src/index.js"></script>
</body>
</html>
